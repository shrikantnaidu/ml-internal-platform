services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:?POSTGRES_USER must be set}", "-d", "${POSTGRES_DB:?POSTGRES_DB must be set}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  mlflow:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-7777}:7777"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      MLFLOW_ARTIFACTS_DESTINATION: /mlflow/artifacts
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://localhost:*"
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 7777
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7777/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: always

volumes:
  postgres-data:
  mlflow-artifacts:
